<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 280" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif">
<style>
.coil{transform-origin:150px 120px;animation:spin 4s linear infinite}
@keyframes spin{0%{transform:scaleX(1)}25%{transform:scaleX(.05)}50%{transform:scaleX(-1)}75%{transform:scaleX(.05)}100%{transform:scaleX(1)}}
.w{fill:none;stroke:#f59f00;stroke-width:3;stroke-dasharray:420;stroke-dashoffset:420;animation:dw 4s linear infinite}
@keyframes dw{to{stroke-dashoffset:0}}
</style>
<rect width="440" height="280" fill="#fff"/>
<rect x="30" y="70" width="44" height="100" rx="6" fill="#f04452"/><text x="52" y="127" fill="#fff" font-size="20" font-weight="700" text-anchor="middle">N</text>
<rect x="226" y="70" width="44" height="100" rx="6" fill="#3182f6"/><text x="248" y="127" fill="#fff" font-size="20" font-weight="700" text-anchor="middle">S</text>
<g stroke="#3182f6" stroke-width="1.5" stroke-dasharray="4 5"><line x1="74" y1="90" x2="226" y2="90"/><line x1="74" y1="120" x2="226" y2="120"/><line x1="74" y1="150" x2="226" y2="150"/></g>
<g class="coil"><rect x="110" y="80" width="80" height="80" rx="4" fill="none" stroke="#c87f2c" stroke-width="6"/></g>
<line x1="150" y1="60" x2="150" y2="180" stroke="#4e5968" stroke-width="2" stroke-dasharray="3 3"/>
<text x="150" y="200" font-size="13" fill="#4e5968" text-anchor="middle">코일이 돌면 지나는 자기장이 계속 변해요</text>
<text x="150" y="40" font-size="14" font-weight="700" fill="#191f28" text-anchor="middle">자석 사이에서 코일을 돌려요</text>
<line x1="300" y1="120" x2="430" y2="120" stroke="#b0b8c1"/><line x1="300" y1="60" x2="300" y2="180" stroke="#b0b8c1"/>
<text x="304" y="58" font-size="11" fill="#6b7684">전류</text><text x="430" y="136" font-size="11" fill="#6b7684" text-anchor="end">시간</text>
<path class="w" d="M300,120 C 316,60 332,60 332,120 S 348,180 364,120 S 380,60 396,120 S 412,180 428,120"/>
<text x="364" y="214" font-size="13" font-weight="700" fill="#191f28" text-anchor="middle">+ 와 - 가 번갈아</text>
<text x="364" y="232" font-size="13" fill="#4e5968" text-anchor="middle">= 방향이 바뀌는 전기, 교류</text>
<text x="220" y="268" font-size="13" fill="#6b7684" text-anchor="middle">손 대신 터빈이 코일을 계속 돌려 줘요 → 발전소</text>
</svg>
