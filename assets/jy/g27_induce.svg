<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 330" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif">
<style>
.mg{animation:mv 6s ease-in-out infinite}
@keyframes mv{0%,8%{transform:translateY(0)}38%,58%{transform:translateY(70px)}88%,100%{transform:translateY(0)}}
.nd{transform-origin:330px 262px;animation:nd 6s ease-in-out infinite}
@keyframes nd{0%,8%{transform:rotate(0)}15%,32%{transform:rotate(-40deg)}38%,58%{transform:rotate(0)}65%,82%{transform:rotate(40deg)}88%,100%{transform:rotate(0)}}
.t1,.t2,.t3{opacity:0;animation:6s infinite}
.t1{animation-name:a1}.t2{animation-name:a2}.t3{animation-name:a3}
@keyframes a1{10%,34%{opacity:1}0%,8%,36%,100%{opacity:0}}
@keyframes a2{40%,58%{opacity:1}0%,38%,60%,100%{opacity:0}}
@keyframes a3{64%,84%{opacity:1}0%,62%,86%,100%{opacity:0}}
.fl{fill:none;stroke:#3182f6;stroke-width:1.6;stroke-dasharray:4 5}
</style>
<rect width="420" height="330" fill="#fff"/>
<g class="mg">
<rect x="95" y="20" width="40" height="40" rx="4" fill="#3182f6"/><rect x="95" y="60" width="40" height="40" rx="4" fill="#f04452"/>
<text x="115" y="46" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">S</text><text x="115" y="86" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">N</text>
<path class="fl" d="M108,100 C 100,140 90,170 70,200"/><path class="fl" d="M115,100 L 115,210"/><path class="fl" d="M122,100 C 130,140 140,170 160,200"/>
<path class="fl" d="M102,100 C 85,130 60,150 40,165"/><path class="fl" d="M128,100 C 145,130 170,150 190,165"/>
</g>
<g fill="none" stroke="#c87f2c" stroke-width="5">
<ellipse cx="115" cy="200" rx="58" ry="14"/><ellipse cx="115" cy="214" rx="58" ry="14"/><ellipse cx="115" cy="228" rx="58" ry="14"/><ellipse cx="115" cy="242" rx="58" ry="14"/>
</g>
<text x="40" y="282" font-size="13" fill="#6b7684">코일</text>
<path d="M173,242 C 220,250 250,270 290,268" fill="none" stroke="#4e5968" stroke-width="2"/>
<rect x="290" y="232" width="80" height="56" rx="8" fill="#f2f4f6" stroke="#4e5968" stroke-width="2"/>
<path d="M300,262 A30,30 0 0 1 360,262" fill="none" stroke="#b0b8c1" stroke-width="2"/>
<text x="330" y="246" font-size="10" fill="#6b7684" text-anchor="middle">0</text>
<line class="nd" x1="330" y1="262" x2="330" y2="236" stroke="#f04452" stroke-width="3" stroke-linecap="round"/>
<text x="330" y="304" font-size="12" fill="#6b7684" text-anchor="middle">검류계 (0이 가운데)</text>
<g font-size="15" font-weight="700">
<text class="t1" x="210" y="70" fill="#191f28">가까이 할 때</text><text class="t1" x="210" y="92" font-size="13" font-weight="400" fill="#4e5968">코일을 지나는 선이 늘어요</text><text class="t1" x="210" y="112" font-size="13" font-weight="400" fill="#4e5968">→ 전류가 흘러요 (바늘 왼쪽)</text>
<text class="t2" x="210" y="70" fill="#191f28">멈춰 있을 때</text><text class="t2" x="210" y="92" font-size="13" font-weight="400" fill="#4e5968">선이 많아도 변하지 않아요</text><text class="t2" x="210" y="112" font-size="13" font-weight="400" fill="#f04452">→ 전류 0 (바늘 가운데)</text>
<text class="t3" x="210" y="70" fill="#191f28">멀리 할 때</text><text class="t3" x="210" y="92" font-size="13" font-weight="400" fill="#4e5968">코일을 지나는 선이 줄어요</text><text class="t3" x="210" y="112" font-size="13" font-weight="400" fill="#4e5968">→ 반대 방향 전류 (바늘 오른쪽)</text>
</g>
<text x="210" y="24" font-size="14" font-weight="700" fill="#191f28">코일을 지나는 자기장이 「변할 때」만 전기가 생겨요</text>
</svg>
