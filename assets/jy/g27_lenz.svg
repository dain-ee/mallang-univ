<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif">
<style>
.ar{animation:p 1.4s ease-in-out infinite}
@keyframes p{0%,100%{opacity:.35}50%{opacity:1}}
.c{fill:none;stroke-width:6;stroke-dasharray:10 8;animation:r 1s linear infinite}
@keyframes r{to{stroke-dashoffset:-36}}
</style>
<rect width="440" height="300" fill="#fff"/>
<line x1="220" y1="40" x2="220" y2="250" stroke="#e5e8eb" stroke-width="2"/>
<!-- left: approaching -->
<text x="110" y="26" font-size="15" font-weight="700" fill="#191f28" text-anchor="middle">N극이 다가오면</text>
<rect x="92" y="44" width="36" height="30" rx="4" fill="#3182f6"/><rect x="92" y="74" width="36" height="30" rx="4" fill="#f04452"/>
<text x="110" y="65" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">S</text><text x="110" y="95" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">N</text>
<path class="ar" d="M150,60 v34 m-7,-8 l7,9 l7,-9" fill="none" stroke="#191f28" stroke-width="2.5"/>
<text x="110" y="140" font-size="22" font-weight="800" fill="#f04452" text-anchor="middle">N</text>
<ellipse cx="110" cy="175" rx="62" ry="16" fill="none" stroke="#c87f2c" stroke-width="6"/>
<path class="c" d="M48,175 A62,16 0 0 0 172,175" stroke="#f59f00"/>
<path d="M160,186 l14,-3 l-10,-10" fill="none" stroke="#f59f00" stroke-width="3"/>
<text x="110" y="222" font-size="13" fill="#4e5968" text-anchor="middle">코일 윗면이 N극이 돼서</text>
<text x="110" y="240" font-size="13" font-weight="700" fill="#191f28" text-anchor="middle">밀어내요 (오지 마!)</text>
<!-- right: leaving -->
<text x="330" y="26" font-size="15" font-weight="700" fill="#191f28" text-anchor="middle">N극이 멀어지면</text>
<rect x="312" y="44" width="36" height="30" rx="4" fill="#3182f6"/><rect x="312" y="74" width="36" height="30" rx="4" fill="#f04452"/>
<text x="330" y="65" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">S</text><text x="330" y="95" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">N</text>
<path class="ar" d="M370,96 v-34 m-7,8 l7,-9 l7,9" fill="none" stroke="#191f28" stroke-width="2.5"/>
<text x="330" y="140" font-size="22" font-weight="800" fill="#3182f6" text-anchor="middle">S</text>
<ellipse cx="330" cy="175" rx="62" ry="16" fill="none" stroke="#c87f2c" stroke-width="6"/>
<path class="c" d="M392,175 A62,16 0 0 1 268,175" stroke="#f59f00"/>
<path d="M280,186 l-14,-3 l10,-10" fill="none" stroke="#f59f00" stroke-width="3"/>
<text x="330" y="222" font-size="13" fill="#4e5968" text-anchor="middle">코일 윗면이 S극이 돼서</text>
<text x="330" y="240" font-size="13" font-weight="700" fill="#191f28" text-anchor="middle">당겨요 (가지 마!)</text>
<text x="220" y="280" font-size="13" fill="#6b7684" text-anchor="middle">노란 화살표 = 코일 앞쪽 전류 방향 · 다가올 때와 멀어질 때 반대예요</text>
</svg>
